<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTINEL — Tam Ekran İnteraktif Bilişsel Mimari Şeması</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050914;
      color: #f8fafc;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.7rem 1.25rem;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      z-index: 20;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .brand-sub {
      font-size: 0.74rem;
      color: #38bdf8;
      margin-top: 0.12rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.36rem 0.72rem;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #334155;
      border-color: #38bdf8;
    }

    .btn-accent {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .canvas-viewport {
      flex: 1;
      overflow: auto;
      cursor: grab;
      user-select: none;
      padding: 2.5rem;
      background-image: radial-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .canvas-viewport.dragging {
      cursor: grabbing;
    }

    .canvas-stage {
      display: inline-block;
      min-width: 100%;
      text-align: center;
    }

    #full-mermaid-target {
      display: inline-block;
      transform-origin: top center;
      transition: transform 0.1s ease-out;
    }

    #full-mermaid-target svg {
      max-width: none !important;
      height: auto;
    }

    .clickable-node {
      cursor: pointer;
      transition: filter 0.15s;
    }

    .clickable-node:hover {
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.9)) brightness(1.15);
    }

    .active-mermaid-node rect,
    .active-mermaid-node polygon {
      stroke: #facc15 !important;
      stroke-width: 3.5px !important;
    }

    /* Slide-over Node Inspector Drawer */
    .inspector-drawer {
      width: 480px;
      max-width: 90vw;
      background: #0b1120;
      border-left: 1px solid #1e293b;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 1.15rem;
      z-index: 15;
    }

    .inspector-drawer.open {
      display: flex;
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.6rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 0.85rem;
    }

    .drawer-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .math-box {
      background: #070b14;
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 0.75rem 0.5rem;
      margin: 0.65rem 0;
      overflow-x: auto;
      text-align: center;
    }

    .code-pre {
      background: #070b14;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.85rem;
      overflow-x: auto;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.55;
      margin-top: 0.5rem;
    }

    .hint-pill {
      position: fixed;
      bottom: 1rem;
      left: 1.25rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 0.38rem 0.85rem;
      font-size: 0.75rem;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="brand-wrap">
      <div class="brand-title">
        <span class="brand-dot"></span>
        <span>SENTINEL — Bilişsel Karar, Merak ve Çift Katmanlı RSI Akış Şeması</span>
      </div>
      <div class="brand-sub">
        Self-Evolving Networked Thought &amp; INference Engine for Local AGI
      </div>
    </div>

    <div class="toolbar">
      <button id="btn-out" class="btn">− Uzaklaştır</button>
      <button id="btn-reset" class="btn">100%</button>
      <button id="btn-in" class="btn">+ Yakınlaştır</button>
      <button id="btn-fit" class="btn">Ekrana Sığdır</button>
      <button id="btn-svg" class="btn">⬇ SVG İndir</button>
      <button id="btn-copy" class="btn">Mermaid Kopyala</button>
      <a href="index.html" class="btn btn-accent">← Redoc Portalına Dön</a>
    </div>
  </header>

  <div class="workspace">
    <div class="canvas-viewport" id="viewport">
      <div class="canvas-stage">
        <div id="full-mermaid-target">Şema hazırlanıyor...</div>
      </div>
    </div>

    <aside class="inspector-drawer" id="drawer">
      <div class="drawer-head">
        <div>
          <div id="d-badge" style="font-family:monospace;font-size:0.7rem;color:#38bdf8;margin-bottom:0.2rem;"></div>
          <div id="d-title" class="drawer-title"></div>
        </div>
        <button id="btn-close-drawer" class="btn">✕</button>
      </div>
      <p id="d-summary" style="font-size:0.84rem;color:#cbd5e1;line-height:1.55;"></p>
      <div id="d-math" class="math-box"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;">
        <span id="d-path" style="font-family:monospace;font-size:0.72rem;color:#94a3b8;"></span>
        <button id="btn-copy-py" class="btn" style="padding:0.22rem 0.55rem;font-size:0.72rem;">Python Kopyala</button>
      </div>
      <pre class="code-pre"><code id="d-code" class="language-python"></code></pre>
    </aside>
  </div>

  <div class="hint-pill">
    🖱️ Sol tık basılı tutarak kaydırın • Fare tekerleği ile yakınlaştırın • Düğümlere tıklayarak Python kodunu açın
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="assets/portal_data.js"></script>
  <script>
    (function () {
      const DATA = window.SENTINEL_PORTAL_DATA;
      const target = document.getElementById("full-mermaid-target");
      const viewport = document.getElementById("viewport");
      const drawer = document.getElementById("drawer");
      let scale = 1.15;
      let activePy = "";

      const nodesByMermaid = {};
      DATA.nodes.forEach((n) => { nodesByMermaid[n.mermaid_id] = n; });

      function setScale(s) {
        scale = Math.max(0.35, Math.min(3.0, s));
        target.style.transform = `scale(${scale})`;
        document.getElementById("btn-reset").textContent = `${Math.round(scale * 100)}%`;
      }

      function openInspector(node) {
        drawer.classList.add("open");
        document.getElementById("d-badge").textContent = `${node.badge} // [${node.mermaid_id}]`;
        document.getElementById("d-title").textContent = node.title;
        document.getElementById("d-summary").textContent = node.summary;
        document.getElementById("d-path").textContent = node.repo_path;
        activePy = node.code;

        const mathEl = document.getElementById("d-math");
        if (window.katex) {
          window.katex.render(node.formula_latex, mathEl, { displayMode: true, throwOnError: false });
        } else {
          mathEl.textContent = node.formula_latex;
        }

        const codeEl = document.getElementById("d-code");
        codeEl.textContent = node.code;
        codeEl.removeAttribute("data-highlighted");
        if (window.hljs) window.hljs.highlightElement(codeEl);

        target.querySelectorAll(".active-mermaid-node").forEach((el) => el.classList.remove("active-mermaid-node"));
        target.querySelectorAll(".node").forEach((g) => {
          if ((g.id || "").includes(`-${node.mermaid_id}-`) || (g.id || "").endsWith(`-${node.mermaid_id}`)) {
            g.classList.add("active-mermaid-node");
          }
        });
      }

      async function renderFullDiagram() {
        window.mermaid.initialize({
          startOnLoad: false,
          theme: "dark",
          securityLevel: "loose",
          themeVariables: { fontSize: "16px", fontFamily: "Inter, Segoe UI, sans-serif" },
          flowchart: { useMaxWidth: false, htmlLabels: true, curve: "basis", nodeSpacing: 55, rankSpacing: 65, padding: 20 }
        });

        const { svg } = await window.mermaid.render("sentinel-standalone-svg", DATA.mermaid_diagram);
        target.innerHTML = svg;
        setScale(1.1);

        target.querySelectorAll(".node").forEach((gNode) => {
          const rawId = gNode.id || "";
          Object.keys(nodesByMermaid).forEach((mKey) => {
            if (rawId.includes(`-${mKey}-`) || rawId.endsWith(`-${mKey}`)) {
              gNode.classList.add("clickable-node");
              gNode.addEventListener("click", () => openInspector(nodesByMermaid[mKey]));
            }
          });
        });
      }

      // Drag to Pan + Wheel Zoom
      let isDown = false, startX = 0, startY = 0, sLeft = 0, sTop = 0;
      viewport.addEventListener("mousedown", (e) => {
        if (e.target.closest(".clickable-node")) return;
        isDown = true;
        viewport.classList.add("dragging");
        startX = e.pageX - viewport.offsetLeft;
        startY = e.pageY - viewport.offsetTop;
        sLeft = viewport.scrollLeft;
        sTop = viewport.scrollTop;
      });
      window.addEventListener("mouseup", () => { isDown = false; viewport.classList.remove("dragging"); });
      viewport.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();
        viewport.scrollLeft = sLeft - (e.pageX - viewport.offsetLeft - startX);
        viewport.scrollTop = sTop - (e.pageY - viewport.offsetTop - startY);
      });
      viewport.addEventListener("wheel", (e) => {
        e.preventDefault();
        setScale(scale + (e.deltaY < 0 ? 0.12 : -0.12));
      }, { passive: false });

      document.getElementById("btn-in").addEventListener("click", () => setScale(scale + 0.2));
      document.getElementById("btn-out").addEventListener("click", () => setScale(scale - 0.2));
      document.getElementById("btn-reset").addEventListener("click", () => setScale(1.0));
      document.getElementById("btn-fit").addEventListener("click", () => {
        const svg = target.querySelector("svg");
        if (!svg) return;
        const w = svg.getBoundingClientRect().width / scale;
        const h = svg.getBoundingClientRect().height / scale;
        const fit = Math.min((viewport.clientWidth - 80) / w, (viewport.clientHeight - 80) / h);
        setScale(Math.max(0.45, fit));
      });
      document.getElementById("btn-svg").addEventListener("click", () => {
        const svgEl = target.querySelector("svg");
        if (!svgEl) return;
        const blob = new Blob([svgEl.outerHTML], { type: "image/svg+xml;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "SENTINEL_Cognitive_Architecture.svg";
        a.click();
      });
      document.getElementById("btn-copy").addEventListener("click", function () {
        navigator.clipboard.writeText(DATA.mermaid_diagram).then(() => {
          const orig = this.textContent;
          this.textContent = "✓ Kopyalandı";
          setTimeout(() => (this.textContent = orig), 1400);
        });
      });
      document.getElementById("btn-close-drawer").addEventListener("click", () => drawer.classList.remove("open"));
      document.getElementById("btn-copy-py").addEventListener("click", function () {
        navigator.clipboard.writeText(activePy).then(() => {
          const orig = this.textContent;
          this.textContent = "✓ Kopyalandı";
          setTimeout(() => (this.textContent = orig), 1400);
        });
      });

      renderFullDiagram();
    })();
  </script>
</body>
</html>
